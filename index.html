<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz & Riddle</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #334155;
    }
    .q-title {
      font-size: 18px;
      color: #f43f5e;
      margin-bottom: 20px;
      line-height: 1.5;
      font-weight: bold;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button.opt {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: right;
    }
    button.opt:hover {
      background: #f43f5e;
      border-color: #f43f5e;
    }
    .result h3 {
      color: #38bdf8;
      font-size: 22px;
      margin-bottom: 10px;
    }
    .result p {
      font-size: 16px;
      color: #cbd5e1;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="card" id="quizCard">
  <div class="q-title" id="questionText">جاري تحميل السؤال...</div>
  <div class="options" id="optionsContainer"></div>
</div>

<script>
const FORMSPREE_URL = "https://formspree.io/f/mvkganog"; 

const quizData = [
  {
    question: "1️⃣ إيه أكثر حاجة بتعدل مزاجك فجأة لما تكوني مضايقة؟",
    options: [
      "أكلة حلوة تحبيها 🍕",
      "رسالة لطيفة من حد عزيز ❤️",
      "تسمعي مزيكا/أغنية هادية 🎧",
      "تنامي وتفصلي خالص 😴"
    ]
  },
  {
    question: "2️⃣ لما يومك بيكون زحمة وطويل، بتفضلي تعملي إيه بالليل؟",
    options: [
      "أتفرج على فيلم أو مسلسلي المفضل 🎬",
      "أتكلم مع حد برتاحله وأفضفض معاه ☕",
      "أقفل الموبايل وأنام على طول 💤"
    ]
  },
  {
    question: "🧠 فزورة صغننة: حاجة كل ما بناخد منها بتكبر أكتر.. إيه هي؟",
    options: [
      "الحفرة 🕳️",
      "الوقت ⏰",
      "العمر 🎂",
      "المشاكل 😅"
    ]
  }
];

let currentIndex = 0;
let userAnswers = {};

function showQuestion() {
  const currentData = quizData[currentIndex];
  document.getElementById("questionText").innerText = currentData.question;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";

  currentData.options.forEach((optText) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerText = optText;
    btn.onclick = () => selectAnswer(currentData.question, optText);
    container.appendChild(btn);
  });
}

function selectAnswer(qText, chosenOpt) {
  userAnswers[`سؤال_${currentIndex + 1}`] = `[${qText}] -> الإجابة: [${chosenOpt}]`;
  currentIndex++;
  
  if (currentIndex < quizData.length) {
    showQuestion();
  } else {
    sendAnswers();
  }
}

function sendAnswers() {
  document.getElementById("quizCard").innerHTML = `<h3>جاري حفظ إجاباتك... ✨</h3>`;

  fetch(FORMSPREE_URL, {
    method: "POST",
    headers: {
      "Accept": "application/json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify(userAnswers)
  }).then(() => {
    showResult();
  }).catch(() => {
    showResult();
  });
}

function showResult() {
  const card = document.getElementById("quizCard");
  card.innerHTML = `
    <div class="result">
      <h3>خلصنا الاختبار! 🎉✨</h3>
      <p>إجاباتك بتدل إنك شخصية رايقة وذوقك عالي بزيادة ❤️</p>
      <p>يلا تعالي قوليلك رأيك في الأسئلة والفزورة 😉✨</p>
    </div>
  `;
}

showQuestion();
</script>
</body>
</html>
