<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Message</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .wrapper {
      cursor: pointer;
    }
    .envelope {
      width: 280px;
      height: 180px;
      background: #e2e8f0;
      position: relative;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.5s ease;
    }
    .heart-btn {
      font-size: 40px;
      transition: transform 0.3s;
    }
    .envelope:hover .heart-btn {
      transform: scale(1.2);
    }
    .card-content {
      display: none;
      text-align: center;
      padding: 20px;
      color: #334155;
    }
    .card-content h2 {
      color: #e11d48;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .card-content p {
      font-size: 16px;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="wrapper" onclick="openEnvelope()">
  <div class="envelope" id="env">
    <div class="heart-btn" id="heart">💌</div>
    <div class="card-content" id="content">
      <h2>رسالة خاصة ✨</h2>
      <p>حبيت أقولك إن كلامك بيفرق وبيعدّل المزاج دايماً ❤️</p>
    </div>
  </div>
</div>

<script>
function openEnvelope() {
  const env = document.getElementById('env');
  const heart = document.getElementById('heart');
  const content = document.getElementById('content');
  
  env.style.background = '#ffffff';
  env.style.width = '320px';
  env.style.height = '200px';
  heart.style.display = 'none';
  content.style.display = 'block';
}
</script>
</body>
</html>
